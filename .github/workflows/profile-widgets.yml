name: Profile widgets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/profile-widgets.yml"

permissions:
  contents: write

jobs:
  # Serpiente que recorre el grafico de contribuciones (rama 'output')
  snake:
    runs-on: ubuntu-latest
    steps:
      - name: Generar animacion snake
        uses: Platane/snk@v3
        with:
          github_user_name: junnior-dev
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publicar a rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: "chore(widgets): actualiza snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
